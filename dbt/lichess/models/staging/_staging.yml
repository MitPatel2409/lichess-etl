models:
  - name: stg_game_aggregates
    description: raw.game_aggregates with clean names and standardized terminations.
    columns:
      - name: time_control
        data_tests:
          - accepted_values:
              arguments:
                values: [ultrabullet, bullet, blitz, rapid, classical, correspondence]
      - name: termination
        data_tests:
          - accepted_values:
              arguments:
                values: [Normal, Time forfeit, Abandoned, Other]

  - name: stg_player_month
    description: raw.player_month with names that match the other models.

  - name: stg_activity_by_hour
    description: raw.activity_by_hour with names that match the other models.
